<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>About Us: White Water Rafting</title>
    <meta name="author" content="Daniel Palomares">
    <meta name="description" content="A page about a rafting company dedicated to bring happiness Adventures
     and other Great Emotions spended with family and friends">
    <link rel="stylesheet" href="styles/contact.css">
</head>

<body>
    <header>
        <img src="images/z-wwr-blue.jpg" alt="Logo of WWR">
        <nav>
            <a href="index.html">Home</a>
            <a href="about.html">About Us</a>
            <a href="trips.html">Trips</a>
            <a href="contact.html">Contact Us</a>
        </nav>
    </header>
    <div class="grid">
        <main>
            <h1>WHITE WATER RAAFTING COMPANY</h1>
            <div class="map">

                <img src="images/blue-pin.jpg" alt="a photo of symbolic location">

                <form>
                    <div class="personal-info">
                        <label for="fullname">Full Name:</label>
                        <input type="text" id="fullname" name="fullname"
                          placeholder="Example: Reed Richards" required>

                        <label for="phone">Phone Number:</label>
                        <input type="tel" id="phone" name="phone" placeholder="123-456-7890">
                    </div>
                    <table class="reasons">
                        <tr>
                            <th rowspan="3">Message Purpose</th>
                            <td><input type="checkbox" id="newsletter" name="newsletter">general
                                Inquiry</td>
                        </tr>
                        <tr>
                            <td><input type="checkbox" id="newsletter" name="newsletter">Reservation
                                Question</td>
                        </tr>
                        <tr>
                            <td><input type="checkbox" id="newsletter" name="newsletter">Website
                                Suggestion</td>
                        </tr>
                    </table>
                    <div class="text-part-form">
                        <div class="message-box">
                            <label for="message">Message:</label>
                            <textarea id="message" name="message" rows="4"></textarea>
                        </div>
                        <div class="check-box">
                            <label><input type="checkbox" id="newsletter" name="newsletter"> Please
                                Subscribe to the monthly newsletter</label>
                        </div>
                        <button type="submit">Get in Touch!</button>
                    </div>
                </form>
            </div>

            <section>
                <h2>We are here to serve you</h2>
                <div class="fig-container">
                    <figure>
                        <img src="images/john.jpg" alt="people having fun">
                        <figcaption>john</figcaption>
                    </figure>
                    <figure>
                        <img src="images/rod.jpeg" alt="people having fun">
                        <figcaption>Rod</figcaption>
                    </figure>
                    <figure>
                        <img src="images/lands.jpg" alt="people having fun">
                        <figcaption>Lands</figcaption>
                    </figure>
                </div>

            </section>
        </main>
    </div>
    <footer>
        <nav class="socialmedia">
            <p>© 2026 | 💧 White Water Rafting 💧 | Daniel Palomares</p>
            <a href="https://facebook.com">
                <img src="images/facebook.svg" alt="Facebook Icon">
            </a>
            <a href="https://linkedin.com">
                <img src="images/linkedin.svg" alt="LinkedIn Icon">
            </a>
            <a href="https://instagram.com">
                <img src="images/instagram.svg" alt="Instagram Icon">
            </a>
        </nav>
    </footer>
</body>

</html>

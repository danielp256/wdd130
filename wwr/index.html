<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Home: White Water Rafting</title>
    <meta name="author" content="Daniel Palomares">
    <meta name="description" content="A page about a rafting company dedicated to bring happiness Adventures
         and other Great Emotions spended with family and friends">
    <link rel="stylesheet" href="styles/rafting.css">
</head>

<body>
    <header>
        <img src="images/z-wwr-blue.jpg" alt="Logo of WWR">
        <nav>
            <a href="index.html">Home</a>
            <a href="about.html">About Us</a>
            <a href="trips.html">Trips</a>
            <a href="contact.html">Contact Us</a>
        </nav>
    </header>
    <div class="in-body">
        <main>
            <div class="hero-in">
                <img src="images/herorafting.jpg" alt="background image">
                <h1>WHITE WATER RAFTING</h1>
            </div>


            <section>
                <div class="slogan">
                    <h2>YOUR ADVENTURE AWAITS!!!</h2>
                </div>
                <div class="figcon">
                    <figure>
                        <img src="images/first-image.jpg" alt="people having fun">
                        <figcaption>Rivers</figcaption>
                    </figure>
                    <figure>
                        <img src="images/thrid-adrenalin.jpg" alt="people having fun">
                        <figcaption>Rapids</figcaption>
                    </figure>
                    <figure>
                        <img src="images/fifth-adventure.jpg" alt="people having fun">
                        <figcaption>Experience</figcaption>
                    </figure>
                </div>
            </section>

            <div class="slogan">
                <h2>IF YOU WANT TO KNOW MORE ABOUT US</h2>
            </div>
            <div class="cat">


                <img src="images/rafting59_600.jpg" alt="a photo of symbolic location">

                <form>
                    <div class="personal-info">
                        <label for="fullname">Full Name:</label>
                        <input type="text" id="fullname" name="fullname"
                          placeholder="Example: Reed Richards" required>

                        <label for="phone">Phone Number:</label>
                        <input type="tel" id="phone" name="phone" placeholder="123-456-7890">

                        <label for="email">Email:</label>
                        <input type="mail@com.com" id="email" name="email"
                          placeholder="fantastic4@marvel.com">
                    </div>
                    <div class="text-part-form">
                        <button type="submit">Get in Touch!</button>
                    </div>
                </form>
            </div>
        </main>
    </div>
    <footer>
        <nav class="socialmedia-width">
            <p>© 2026</p>
            <p>|</p>
            <p>💧 White Water Rafting 💧</p>
            <p>|</p>
            <p>Daniel Palomares</p>
            <a href="https://facebook.com">
                <img src="images/facebook.svg" alt="Facebook Icon">
            </a>
            <a href="https://linkedin.com">
                <img src="images/linkedin.svg" alt="LinkedIn Icon">
            </a>
            <a href="https://instagram.com">
                <img src="images/instagram.svg" alt="Instagram Icon">
            </a>
        </nav>
    </footer>
</body>

</html>
